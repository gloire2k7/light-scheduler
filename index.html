<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Scheduler</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(to bottom right, #1e3a8a, #3b82f6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .time-input {
            transition: all 0.3s ease;
        }
        .time-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .submit-btn {
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card p-8 w-full max-w-md">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Smart Light Scheduler</h2>
        <div class="space-y-6">
            <div>
                <label for="onTime" class="block text-sm font-medium text-gray-700 mb-1">Light ON Time</label>
                <input type="time" id="onTime" class="time-input w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="offTime" class="block text-sm font-medium text-gray-700 mb-1">Light OFF Time</label>
                <input type="time" id="offTime" class="time-input w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button onclick="sendSchedule()" class="submit-btn w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                Set Schedule
            </button>
        </div>
    </div>

    <script>
        const ws = new WebSocket("ws://localhost:8765");

        function sendSchedule() {
            const onTime = document.getElementById("onTime").value;
            const offTime = document.getElementById("offTime").value;
            if (onTime && offTime) {
                ws.send(JSON.stringify({ on: onTime, off: offTime }));
                alert("Schedule set successfully!");
            } else {
                alert("Please select both ON and OFF times.");
            }
        }

        ws.onopen = () => console.log("Connected to WebSocket server");
        ws.onerror = (error) => console.error("WebSocket error:", error);
    </script>
</body>
</html>
